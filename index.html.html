<script id="site-settings" type="application/json">{"title":"문답법이란?","description":"질문과 답변을 통해 자신이 모르는 것을 깨닫고, 더 나은 진리에 가까워지도록 돕는 대화법","color":"#548aff"}</script>
<script>
// 이 파일은 브라우저 시제품입니다. localStorage는 계정 인증/공유 서버를 제공하지 않습니다.
const KEY='mundap_posts_v1', USERKEY='mundap_user_v1';
const $=id=>document.getElementById(id);
const safely=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const posts=()=>load(KEY,[]);const savePosts=data=>localStorage.setItem(KEY,JSON.stringify(data));
const defaults=JSON.parse($('site-settings').textContent);
let settings=defaults;
let user=localStorage.getItem(USERKEY)||'';let sortMode='new';let currentId=null;
function ensureUser(){if(user)return true;let proposed=prompt('사용할 이름을 입력하세요. (계정 인증이 아닌 브라우저 체험 기능입니다.)');if(!proposed||!proposed.trim())return false;user=proposed.trim().slice(0,30);localStorage.setItem(USERKEY,user);updateHeader();return true}
function changeUser(){let name=prompt('전환할 이름 (이 브라우저에서만 작동)',user);if(!name||!name.trim())return;user=name.trim().slice(0,30);localStorage.setItem(USERKEY,user);updateHeader();goHome()}
function updateHeader(){$('who').textContent=user?user+' 님':'방문자';$('noticeCount').textContent=posts().reduce((n,p)=>n+(p.author===user?p.questions.filter(q=>q.status==='pending').length:0),0)}
function applySettings(){$('introTitle').textContent=settings.title;$('introDesc').textContent=settings.description;document.documentElement.style.setProperty('--blue',settings.color);}
function show(section){for(const id of ['home','write','detail','inbox'])$(id).classList.toggle('hidden',id!==section);updateHeader();window.scrollTo(0,0)}
function navigate(hash){if(location.hash!==hash)history.pushState(null,'',hash)}
function goHome(){navigate('#home');show('home');renderCards()}
function goWrite(){if(!ensureUser())return;navigate('#write');show('write');reviewPost();$('postTitle').focus()}
// 오프라인 질문 코치: 외부 AI 모델이 아니라 설명 가능한 규칙 기반 분석입니다.
function questionReview(raw){
 const text=String(raw||'').trim();
 if(!text)return {pass:false,score:0,message:'질문을 입력하면 소크라테스식 질문의 특징을 점검합니다.',details:[]};
 const question=/(\?|？|왜|어떻게|무엇|뭐|누구|언제|어디|어느|어떤|과연|정말|인가요|일까요|까요|나요|습니까|는지|을지|할까|일까|인지|가능한가|맞는가)/.test(text);
 const open=/(왜|어떻게|어떤|무엇|무슨|어느|어떠한|무엇을|어떠|어디에서)/.test(text);
 const reason=/(근거|이유|전제|가정|어째서|왜|정당|판단|타당|뒷받침|증거|확신)/.test(text);
 const perspective=/(다른|반대|대안|관점|입장|예외|만약|경우|비교|누구에게|어떤 사람)/.test(text);
 const implication=/(결과|영향|문제|의미|책임|변화|이어지|발생|장기|어떻게 될|기준)/.test(text);
 const context=text.length>=25;
 const criteria=[
  {ok:question,name:'질문형 문장',hint:'물음표나 명확한 의문 표현을 사용해 보세요.'},
  {ok:open,name:'열린 질문',hint:'예/아니요로 끝나지 않도록 ‘왜’, ‘어떻게’, ‘어떤’으로 확장해 보세요.'},
  {ok:reason,name:'근거와 전제',hint:'주장에 어떤 근거 또는 숨은 전제가 있는지 물어보세요.'},
  {ok:perspective,name:'다양한 관점',hint:'반대 관점이나 예외 상황을 고려해 보세요.'},
  {ok:implication,name:'결과와 함의',hint:'그 생각을 받아들였을 때 어떤 결과가 생기는지 질문해 보세요.'},
  {ok:context,name:'맥락의 구체성',hint:'질문 대상과 상황을 구체적으로 제시해 보세요.'}
 ];
 const score=criteria.filter(c=>c.ok).length;
 const missing=criteria.filter(c=>!c.ok).map(c=>c.hint);
 const level=score>=5?'심화 질문에 가까움':score>=3?'발전 가능성이 있는 질문':'질문을 더 다듬어 보세요';
 return {pass:question,score,message:`${level} · ${score}/6개 기준 충족`,details:missing.slice(0,3)};
}
function setReview(el,result){
 if(!el)return;
 el.classList.toggle('warn',!result.pass);
 const detail=(result.details||[]).map(x=>`<li>${safely(x)}</li>`).join('');
 el.innerHTML=`<strong>${safely(result.message)}</strong>${detail?`<ul style="margin:7px 0 0;padding-left:20px">${detail}</ul>`:''}<div class="muted" style="margin-top:7px">자동 질문 코칭은 단어·문장 구조 분석으로, AI 의미 평가나 정답 판정이 아닙니다.</div>`;
}

function reviewAsk(){setReview($('askReview'),questionReview($('askText')?.value))}

function submitPost(){if(!ensureUser())return;const title=$('postTitle').value.trim(),body=$('postBody').value.trim();if(!title||!body)return alert('제목과 내용을 모두 입력하세요.');const data=posts();data.unshift({id:crypto.randomUUID(),author:user,title,body,created:Date.now(),questions:[]});savePosts(data);$('postTitle').value='';$('postBody').value='';goHome()}
function relevance(p,words){const title=p.title.toLocaleLowerCase(),body=p.body.toLocaleLowerCase();return words.reduce((s,w)=>s+(title===w?12:0)+(title.includes(w)?5:0)+(body.includes(w)?2:0),0)}
function renderCards(){const raw=$('search').value.trim().toLocaleLowerCase(),words=raw.split(/\s+/).filter(Boolean);let data=posts().map(p=>({...p,score:relevance(p,words)}));if(words.length)data=data.filter(p=>words.every(w=>(p.title+' '+p.body).toLocaleLowerCase().includes(w))).sort((a,b)=>b.score-a.score||b.created-a.created);else if(sortMode==='popular')data.sort((a,b)=>b.questions.length-a.questions.length||b.created-a.created);else data.sort((a,b)=>b.created-a.created);$('newest').style.background=sortMode==='new'?'#e8f2ff':'';$('popular').style.background=sortMode==='popular'?'#e8f2ff':'';$('cards').innerHTML=data.length?data.map(p=>`<button class="card" onclick="openPost('${p.id}')"><span class="badge">♧ 발의안</span><h3>${safely(p.title)}</h3><p>${safely(p.body)}</p><span class="meta">${safely(p.author)} · ${new Date(p.created).toLocaleDateString('ko-KR')} · 받은 질문 ${p.questions.length}개</span></button>`).join(''):'<div class="empty">등록된 발의안이 없습니다. 첫 번째 발의안을 작성해 보세요.</div>'}
function openPost(id){const p=posts().find(x=>x.id===id);if(!p)return goHome();currentId=id;navigate('#post-'+encodeURIComponent(id));const approved=p.questions.filter(q=>q.status==='accepted');$('detail').innerHTML=`<button class="btn" onclick="goHome()">← 공개 발의</button><h2 style="margin-top:20px">${safely(p.title)}</h2><p class="muted">작성자 ${safely(p.author)} · ${new Date(p.created).toLocaleString('ko-KR')}</p><div class="bodytext" style="padding:20px;background:#eaf4ff;border-radius:12px">${safely(p.body)}</div><h3>승인된 질문과 답변 (${approved.length})</h3>${approved.length?approved.map(q=>`<div class="question"><div class="muted">질문자: ${safely(q.by)}</div><p>${safely(q.text)}</p><div class="answer">${q.answer?safely(q.answer):'<span class="muted">답변을 기다리는 중입니다.</span>'}</div>${p.author===user?`<div class="row"><textarea class="input" id="answer-${q.id}" placeholder="답변 작성">${safely(q.answer||'')}</textarea><button class="btn primary" onclick="reply('${p.id}','${q.id}')">답변 저장</button></div>`:''}</div>`).join(''):'<p class="muted">아직 승인된 질문이 없습니다.</p>'}<hr style="border:0;border-top:1px solid #d9e6f7;margin:24px 0"><h3>글쓴이에게 질문 보내기</h3><p class="muted">이 브라우저의 작성자 받은 질문함에 대기 상태로 저장되며, 수락 후 공개됩니다. 다른 기기에는 전송되지 않습니다.</p><textarea id="askText" class="textbox" style="min-height:120px" placeholder="이 발의안에 대한 질문을 작성하세요. 예: 이 방안은 어떤 문제를 해결할 수 있나요?" oninput="reviewAsk()"></textarea><div id="askReview" class="review hidden" aria-live="polite"></div><div class="row"><button class="btn primary" onclick="sendQuestion('${p.id}')">질문 보내기</button></div>`;show('detail');reviewAsk()}
function sendQuestion(id){if(!ensureUser())return;const text=$('askText').value.trim();if(!text)return alert('질문을 입력하세요.');const check=questionReview(text);if(!check.pass&&!confirm('질문형 표현이 명확하지 않습니다.\n'+check.message+'\n\n그래도 작성자에게 보내시겠습니까?'))return;const data=posts(),p=data.find(x=>x.id===id);if(!p)return;if(p.author===user)return alert('본인의 글에는 질문을 보낼 수 없습니다.');p.questions.push({id:crypto.randomUUID(),by:user,text,status:'pending',answer:'',created:Date.now()});savePosts(data);alert('질문이 이 브라우저의 받은 질문함에 저장되었습니다.');openPost(id)}
function showInbox(){if(!ensureUser())return;navigate('#inbox');const mine=posts().filter(p=>p.author===user);const pending=mine.flatMap(p=>p.questions.filter(q=>q.status==='pending').map(q=>({p,q})));const rejected=mine.flatMap(p=>p.questions.filter(q=>q.status==='rejected').map(q=>({p,q})));$('inbox').innerHTML=`<h2>받은 질문</h2><p class="muted">현재 브라우저의 선택된 이름에 해당하는 질문을 표시합니다. 실제 본인 확인이나 비공개 보호 기능은 적용되지 않았습니다.</p><h3>승인 대기 (${pending.length})</h3>${pending.map(({p,q})=>`<div class="question pending"><b>${safely(p.title)}</b><p>${safely(q.text)}</p><span class="muted">질문자 ${safely(q.by)}</span><div class="row"><button class="btn primary" onclick="decide('${p.id}','${q.id}','accepted')">수락</button><button class="btn danger" onclick="decide('${p.id}','${q.id}','rejected')">거절</button></div></div>`).join('')||'<p class="muted">승인을 기다리는 질문이 없습니다.</p>'}<h3>거절한 질문 (${rejected.length})</h3>${rejected.map(({p,q})=>`<div class="question"><b>${safely(p.title)}</b><p>${safely(q.text)}</p><span class="muted">질문자 ${safely(q.by)}</span><div class="row"><button class="btn" onclick="decide('${p.id}','${q.id}','accepted')">다시 수락</button></div></div>`).join('')||'<p class="muted">거절한 질문이 없습니다.</p>'}`;show('inbox')}
function decide(pid,qid,status){const data=posts(),p=data.find(x=>x.id===pid);if(!p||p.author!==user)return alert('글 작성자만 승인할 수 있습니다.');const q=p.questions.find(x=>x.id===qid);if(q){q.status=status;savePosts(data)}showInbox()}
function reply(pid,qid){const data=posts(),p=data.find(x=>x.id===pid);if(!p||p.author!==user)return alert('글 작성자만 답변할 수 있습니다.');const q=p.questions.find(x=>x.id===qid);if(!q||q.status!=='accepted')return;const text=$('answer-'+qid).value.trim();if(!text)return alert('답변을 입력하세요.');q.answer=text;savePosts(data);openPost(pid)}
function syncRoute(){const hash=decodeURIComponent(location.hash||'#home');if(hash==='#write'){goWrite()}else if(hash==='#inbox'){showInbox()}else if(hash.startsWith('#post-')){openPost(hash.slice(6))}else{show('home');renderCards()}}
window.addEventListener('popstate',syncRoute);window.addEventListener('hashchange',syncRoute);
applySettings();updateHeader();syncRoute();
</script>
</body></html>
